{% extends 'base.html' %}
{% block title %}Add KICOSCA Discipline {{ reg.county }}{% endblock %}
{% block content %}
<div class="page-header">
  <div class="breadcrumb">
    <a href="{% url 'kicosca_dashboard' %}">KICOSCA</a>
    <span>Add Discipline</span>
  </div>
  <h1><i class="bi bi-trophy"></i> Add KICOSCA Discipline</h1>
  <p>{{ reg.county }} County {{ edition.name }}</p>
</div>
<div class="s-eb7d2f4">
  <div class="card s-ac8fd7e">
    <form method="post">
      {% csrf_token %}
      <div class="s-92cb257">
        <label class="s-a6838e2">Select Sport *</label>
        <select name="sport" class="form-control" required>
          <option value="">— choose a sport —</option>
          {% for val, label in available %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="s-2259230">
        <button type="submit" class="s-0647e45">
          Add Discipline
        </button>
        <a href="{% url 'kicosca_dashboard' %}" class="s-4bdeb5f">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
