{% extends 'base.html' %}
{% block title %}Add KICOSCA Discipline {{ reg.county }}{% endblock %}
{% block content %}
<div class="page-header">
  <div class="breadcrumb">
    <a href="{% url 'kicosca_dashboard' %}">KICOSCA</a>
    <span>Add Discipline</span>
  </div>
  <h1><i class="bi bi-trophy"></i> Add KICOSCA Discipline</h1>
  <p>{{ reg.county }} County {{ edition.name }}</p>
</div>
<div style="max-width:480px">
  <div class="card" style="padding:1.75rem">
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:1.5rem">
        <label style="display:block;font-weight:700;color:#333;margin-bottom:.5rem">Select Sport *</label>
        <select name="sport" class="form-control" required>
          <option value="">— choose a sport —</option>
          {% for val, label in available %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div style="display:flex;gap:.75rem">
        <button type="submit" style="flex:1;padding:.75rem;background:#7c3aed;color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer">
          Add Discipline
        </button>
        <a href="{% url 'kicosca_dashboard' %}" style="padding:.75rem 1.25rem;background:#e5e7eb;color:#333;border-radius:9px;text-decoration:none;font-size:.95rem;font-weight:600">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
