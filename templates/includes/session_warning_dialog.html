{# Session-expiry warning dialog — mounted once inside portal base.html #}
{# portal.js wires all interactions; no inline JS here.                   #}
<dialog id="session-warning-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="swd-title"
        aria-describedby="swd-desc">

  <div class="swd-inner">
    <div class="swd-icon" aria-hidden="true">
      <i class="bi bi-lock-fill"></i>
    </div>

    <h2 class="swd-title" id="swd-title">Session Expiring</h2>

    <p class="swd-desc" id="swd-desc">
      You have been inactive. You will be logged out in
    </p>

    <div class="swd-countdown" aria-hidden="true">
      <span data-countdown>60</span>
    </div>
    <div class="swd-countdown-label" aria-hidden="true">seconds</div>

    {# aria-live announces the countdown to screen readers every 10 s #}
    <span class="sr-only" aria-live="polite" aria-atomic="true"></span>

    <div class="swd-actions">
      <button type="button"
              class="swd-btn swd-btn--primary"
              data-action="session-stay"
              autofocus>
        <i class="bi bi-check-lg" aria-hidden="true"></i>
        Stay Logged In
      </button>
      <button type="button"
              class="swd-btn swd-btn--ghost"
              data-action="session-logout">
        Log Out Now
      </button>
    </div>
  </div>

</dialog>
