{% extends 'base.html' %}
{% block title %}Compose Email KYISA CMS{% endblock %}

{% block content %}
<div class="page-header">
    <div class="breadcrumb">
        <a href="{% url 'email_logs' %}"><i class="bi bi-envelope"></i> Email Centre</a>
        <span>/</span>
        <span>Compose</span>
    </div>
    <h1><i class="bi bi-pencil-square"></i> Compose Email</h1>
</div>

<div class="card">
    <form method="post" action="{% url 'email_compose' %}">
        {% csrf_token %}
        <div class="s-339b487">
            <!-- To -->
            <div>
                <label class="s-e8f88b3">To <span class="s-9cb6f55">*</span></label>
                <textarea name="to_emails" rows="2" class="form-input s-84900d1" placeholder="email@example.com, another@example.com" required>{{ reply_to|default:to_emails }}</textarea>
                <small class="s-aa15cb0">Separate multiple addresses with commas</small>
            </div>

            <!-- CC -->
            <div>
                <label class="s-e8f88b3">CC <span class="s-9bcf00c">(optional)</span></label>
                <input type="text" name="cc_emails" value="{{ cc_emails }}" class="form-input s-84900d1" placeholder="cc@example.com">
            </div>

            <!-- Subject -->
            <div>
                <label class="s-e8f88b3">Subject <span class="s-9cb6f55">*</span></label>
                <input type="text" name="subject" value="{{ subject }}" class="form-input s-84900d1" placeholder="Email subject..." required>
            </div>

            <!-- Body -->
            <div>
                <label class="s-e8f88b3">Message <span class="s-9cb6f55">*</span></label>
                <textarea name="body" rows="12" class="form-input s-00e7ca7" placeholder="Write your message here..." required>{{ body }}</textarea>
                <small class="s-aa15cb0">Email will be sent with the KYISA branded template</small>
            </div>

            <!-- Actions -->
            <div class="s-7a39d22">
                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Send Email</button>
                <a href="{% url 'email_logs' %}" class="btn btn-outline">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
