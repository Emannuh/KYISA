{% extends 'base.html' %}
{% block title %}Delete {{ object_type }} KYISA Media{% endblock %}

{% block content %}
<div class="portal-page-head">
    <div class="portal-breadcrumb">
        <a href="{% url 'media_dashboard' %}">Media</a>
        <span class="sep"><i class="bi bi-chevron-right"></i></span>
        <span>Delete {{ object_type }}</span>
    </div>
    <h1><i class="bi bi-exclamation-triangle s-767a43b"></i> Confirm Deletion</h1>
</div>

<div class="portal-form s-21418d5">
    <div class="portal-form-card s-f55e0ef">
        <div class="portal-form-body s-65f9d5a">
            <i class="bi bi-exclamation-triangle s-87a9cd2"></i>
            <h3 class="s-94c366f">Delete {{ object_type }}?</h3>
            <p class="s-102a74f">This action cannot be undone.</p>
            <div class="s-ffa674c">
                {{ object }}
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="pbtn-group s-c1780db">
                    <a href="{% url back_url %}" class="pbtn pbtn-secondary">Cancel</a>
                    <button type="submit" class="pbtn pbtn-danger"><i class="bi bi-trash"></i> Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
