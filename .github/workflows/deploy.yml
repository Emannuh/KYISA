name: Deploy KYISA CMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "accounts,admin_dashboard,appeals,competitions,kyisa_cms,matches,news_media,referees,teams,templates,static,Dockerfile,manage.py,Procfile,requirements.txt"
          target: /opt/kyisa/
          overwrite: true

      - name: Build and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/kyisa

            echo "=== Building Docker image ==="
            docker build -t kyisa-cms-new .

            echo "=== Stopping old container ==="
            docker stop kyisa-cms || true
            docker rm kyisa-cms || true

            echo "=== Stopping old Postgres container ==="
            docker stop kyisa-db || true
            docker rm kyisa-db || true

            echo "=== Starting Postgres ==="
            docker run -d \
              --name kyisa-db \
              --restart unless-stopped \
              --network kyisa-net \
              -v /opt/kyisa/pgdata:/var/lib/postgresql/data \
              -e POSTGRES_DB=kyisa_db \
              -e POSTGRES_USER=kyisa_user \
              -e POSTGRES_PASSWORD=$(grep DB_PASSWORD /opt/kyisa/.env | cut -d '=' -f2) \
              postgres:16-alpine

            echo "=== Waiting for Postgres to be ready ==="
            sleep 8

            echo "=== Running migrations & collectstatic ==="
            docker run --rm \
              --network kyisa-net \
              --env-file .env \
              -v /opt/kyisa/media:/app/media \
              -v /opt/kyisa/staticfiles:/app/staticfiles \
              kyisa-cms-new sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"

            echo "=== Starting app container ==="
            docker run -d \
              --name kyisa-cms \
              --restart unless-stopped \
              --network kyisa-net \
              --env-file .env \
              -p 8080:8080 \
              -v /opt/kyisa/media:/app/media \
              -v /opt/kyisa/staticfiles:/app/staticfiles \
              kyisa-cms-new

            sleep 5

            echo "=== Tagging image ==="
            docker tag kyisa-cms-new kyisa-cms
            docker image prune -f

            echo "=== Ensuring Nginx upload limit ==="
            sudo grep -q 'client_max_body_size' /etc/nginx/sites-available/kyisa \
              && sudo sed -i 's/client_max_body_size.*/client_max_body_size 500M;/' /etc/nginx/sites-available/kyisa \
              || sudo sed -i '/server_name/a\    client_max_body_size 500M;' /etc/nginx/sites-available/kyisa
            sudo nginx -t && sudo systemctl reload nginx

            echo "=== Verifying ==="
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8080/healthz/)
            echo "Health check: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "DEPLOY FAILED — health check returned $STATUS"
              exit 1
            fi
            echo "=== Deploy complete ==="
