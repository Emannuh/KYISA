<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" preserveAspectRatio="none" role="img" aria-label="Flag of Kenya">
  <title>Flag of Kenya</title>
  <!-- Bands: black, white, red, white, green in the official 6:1:6:1:6 ratio -->
  <rect width="600" height="400" fill="#006600"/>
  <rect width="600" height="280" fill="#ffffff"/>
  <rect width="600" height="260" fill="#BB0000"/>
  <rect width="600" height="140" fill="#ffffff"/>
  <rect width="600" height="120" fill="#000000"/>

  <!-- Two crossed white Maasai spears, behind the shield -->
  <g fill="#ffffff">
    <g transform="translate(300 200) rotate(28)">
      <rect x="-3" y="-128" width="6" height="314" rx="3"/>
      <path d="M0 -196 C 11 -176, 12 -150, 0 -122 C -12 -150, -11 -176, 0 -196 Z"/>
      <rect x="-4.5" y="176" width="9" height="16" rx="3"/>
    </g>
    <g transform="translate(300 200) rotate(-28)">
      <rect x="-3" y="-128" width="6" height="314" rx="3"/>
      <path d="M0 -196 C 11 -176, 12 -150, 0 -122 C -12 -150, -11 -176, 0 -196 Z"/>
      <rect x="-4.5" y="176" width="9" height="16" rx="3"/>
    </g>
  </g>

  <!-- Maasai shield -->
  <g>
    <!-- Outer body: black sides with a thin white rim -->
    <path d="M300 40 C 396 100, 396 300, 300 360 C 204 300, 204 100, 300 40 Z" fill="#000000" stroke="#ffffff" stroke-width="3"/>
    <!-- White crescents separating the black sides from the red centre -->
    <path d="M300 52 C 375 108, 375 292, 300 348 C 225 292, 225 108, 300 52 Z" fill="#ffffff"/>
    <!-- Red centre -->
    <path d="M300 60 C 364 114, 364 286, 300 340 C 236 286, 236 114, 300 60 Z" fill="#BB0000"/>
    <!-- Central white lens with red core -->
    <path d="M300 146 C 322 172, 322 228, 300 254 C 278 228, 278 172, 300 146 Z" fill="#ffffff"/>
    <path d="M300 168 C 311 184, 311 216, 300 232 C 289 216, 289 184, 300 168 Z" fill="#BB0000"/>
    <!-- Upper and lower white marks on the centre line -->
    <path d="M300 74 C 309 90, 309 112, 300 128 C 291 112, 291 90, 300 74 Z" fill="#ffffff"/>
    <path d="M300 272 C 309 288, 309 310, 300 326 C 291 310, 291 288, 300 272 Z" fill="#ffffff"/>
    <!-- Black side bands on the red centre -->
    <path d="M258 120 C 247 160, 247 240, 258 280 C 266 240, 266 160, 258 120 Z" fill="#000000"/>
    <path d="M342 120 C 353 160, 353 240, 342 280 C 334 240, 334 160, 342 120 Z" fill="#000000"/>
  </g>
</svg>
